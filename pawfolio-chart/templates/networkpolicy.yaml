apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ include "pawfolio.fullname" . }}-networkpolicy
  namespace: {{ .Release.Namespace }}

  labels:
{{ include "pawfolio.labels" . | indent 4 }}

spec:
  podSelector:
    matchLabels:
{{ include "pawfolio.selectorLabels" . | indent 6 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector: {}

      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres

      ports:
        - protocol: TCP
          port: 5432

    - to:
        - namespaceSelector: {}

      ports:
        - protocol: UDP
          port: 53

    - to:
        - namespaceSelector: {}

      ports:
        - protocol: TCP
          port: 53
          