apiVersion: v1
kind: Service

metadata:
  name: pawfolio-service
  namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}

  selector:
{{ include "pawfolio.selectorLabels" . | indent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      