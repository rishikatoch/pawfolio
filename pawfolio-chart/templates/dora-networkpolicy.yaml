apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ include "pawfolio.fullname" . }}-dora
  namespace: {{ .Release.Namespace }}

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pawfolio-dora
      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - ports:
        - protocol: TCP
          port: 443
