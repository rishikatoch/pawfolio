# -----------------------------------------------------------------------------
# Helm Release Naming
# -----------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Pawfolio Application
# -----------------------------------------------------------------------------

replicaCount: 1

image:
  repository: "pawfolio"

  # Avoid using "latest" in production.
  tag: "1.0.0"

  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Pod Security Context
# -----------------------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -----------------------------------------------------------------------------
# Container Security Context
# -----------------------------------------------------------------------------

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

  capabilities:
    drop:
      - ALL

  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  protocol: TCP

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------

ingress:
  enabled: true

  className: nginx

  hosts:
    - host: pawfolio.local
      paths:
        - /

  tls: []

# -----------------------------------------------------------------------------
# Resource Requests & Limits
# -----------------------------------------------------------------------------

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

# -----------------------------------------------------------------------------
# ConfigMap
# -----------------------------------------------------------------------------

config:
  create: true

  APP_NAME: "Pawfolio"
  FLASK_DEBUG: "False"

# -----------------------------------------------------------------------------
# Secret
# -----------------------------------------------------------------------------

secret:
  create: true

  databaseUrl: "postgresql://pawfolio:password@postgres:5432/pawfolio"
  secretKey: "change-me-later"

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------

postgres:
  image:
    repository: "postgres"
    tag: "16"
    pullPolicy: "IfNotPresent"

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  auth:
    database: "pawfolio"
    username: "pawfolio"
    password: "password"

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    storageClass: standard
    size: 5Gi

# -----------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# -----------------------------------------------------------------------------

hpa:
  enabled: false

  minReplicas: 1
  maxReplicas: 5

  targetCPUUtilizationPercentage: 50
