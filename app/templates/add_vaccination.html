{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="page-header text-center mb-5">

        <span class="page-badge">

            <i class="bi bi-shield-plus"></i>

            Pawfolio

        </span>

        <h1>

            Add Vaccination

        </h1>

        <p>

            Record a new vaccination for
            <strong>{{ pet.name }}</strong>
            and keep the health timeline up to date.

        </p>

    </div>

    <div class="glass-form">

        <form method="POST">

            <div class="form-section">

                <div class="section-title">

                    <i class="bi bi-heart-pulse-fill"></i>

                    Vaccination Details

                </div>

                <div class="row g-4">

                    <!-- Vaccine Name -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Vaccine Name

                        </label>

                        <input type="text" name="vaccine_name" class="form-control" placeholder="Rabies, DHPP, Parvo..."
                            required>

                    </div>

                    <!-- Veterinarian -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Veterinarian

                        </label>

                        <input type="text" name="veterinarian" class="form-control" placeholder="Doctor or Clinic Name">

                    </div>

                    <!-- Date Given -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Date Given

                        </label>

                        <input type="date" name="date_given" class="form-control" required>

                    </div>

                    <!-- Next Due -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Next Due Date

                        </label>

                        <input type="date" name="next_due" class="form-control" required>

                    </div>

                    <!-- Notes -->

                    <div class="col-12">

                        <label class="form-label">

                            Notes

                        </label>

                        <textarea name="notes" rows="5" class="form-control"
                            placeholder="Enter observations, side effects, vaccine batch details, reminders or anything important..."></textarea>

                    </div>

                </div>

            </div>

            <div class="form-actions">

                <button type="submit" class="btn btn-success btn-lg">

                    <i class="bi bi-shield-check me-2"></i>

                    Save Vaccination

                </button>

                <a href="{{ url_for('pet_profile', pet_id=pet.id) }}" class="btn btn-outline-secondary btn-lg">

                    <i class="bi bi-arrow-left me-2"></i>

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
