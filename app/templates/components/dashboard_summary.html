<section class="dashboard-summary mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Health Summary
            </h2>

            <p class="text-secondary mb-0">
                A quick overview of your pets' health.
            </p>

        </div>

    </div>

    <div class="row g-4">

        <div class="col-md-6 col-xl-3">

            <div class="summary-card">

                <div class="summary-icon bg-primary-subtle">
                    🐶
                </div>

                <h3>{{ pets|length }}</h3>

                <p>Total Pets</p>

            </div>

        </div>

        <div class="col-md-6 col-xl-3">

            <div class="summary-card">

                <div class="summary-icon bg-success-subtle">
                    💉
                </div>

                <h3>0</h3>

                <p>Vaccines Due</p>

            </div>

        </div>

        <div class="col-md-6 col-xl-3">

            <div class="summary-card">

                <div class="summary-icon bg-warning-subtle">
                    🪱
                </div>

                <h3>0</h3>

                <p>Deworming Due</p>

            </div>

        </div>

        <div class="col-md-6 col-xl-3">

            <div class="summary-card">

                <div class="summary-icon bg-danger-subtle">
                    🎂
                </div>

                <h3>0</h3>

                <p>Birthdays This Month</p>

            </div>

        </div>

    </div>

</section>
