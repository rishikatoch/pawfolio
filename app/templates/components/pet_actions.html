<!-- ==========================================================
     Profile Actions
========================================================== -->

<div class="container py-5">

    <div class="profile-actions">

        <a href="{{ url_for('edit_pet', pet_id=pet.id) }}" class="btn btn-warning">

            <i class="bi bi-pencil-square"></i>
            Edit Pet

        </a>

        <a href="{{ url_for('add_vaccination', pet_id=pet.id) }}" class="btn btn-success">

            <i class="bi bi-shield-plus"></i>
            Add Vaccination

        </a>

        <a href="{{ url_for('add_deworming', pet_id=pet.id) }}" class="btn btn-info">

            <i class="bi bi-bug"></i>
            Add Deworming

        </a>

        <form method="POST" action="{{ url_for('delete_pet', pet_id=pet.id) }}"
            onsubmit="return confirm('Are you sure you want to delete this pet?');">

            <button type="submit" class="btn btn-danger">

                <i class="bi bi-trash"></i>
                Delete Pet

            </button>

        </form>

    </div>

</div>
