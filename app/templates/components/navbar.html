<!-- ==========================================================
     PAWFOLIO NAVBAR
========================================================== -->

<nav class="pf-navbar">

    <div class="container">

        <div class="pf-navbar-inner">

            <!-- ==============================================
                 BRAND
            =============================================== -->

            <a href="{{ url_for('home') }}" class="pf-brand">

                <div class="pf-brand-icon">

                    <i class="bi bi-heart-fill"></i>
                    <i class="bi bi-paw-fill"></i>

                </div>

                <div class="pf-brand-text">

                    <span class="pf-brand-title">

                        Pawfolio

                    </span>

                    <span class="pf-brand-subtitle">

                        Your Pet's Digital Companion

                    </span>

                </div>

            </a>


            <!-- ==============================================
                 NAVIGATION
            =============================================== -->

            {% if current_user.is_authenticated %}

            <div class="pf-nav-links">

                <a href="{{ url_for('home') }}" class="pf-nav-link active">

                    <i class="bi bi-grid-1x2-fill"></i>

                    Dashboard

                </a>

            </div>

            {% endif %}


            <!-- ==============================================
                 RIGHT SIDE
            =============================================== -->

            <div class="pf-user-area">

                {% if current_user.is_authenticated %}

                <div class="dropdown">

                    <button class="pf-user-button" data-bs-toggle="dropdown">

                        <div class="pf-avatar">

                            {{ current_user.username[:1]|upper }}

                        </div>

                        <div class="pf-user-info">

                            <span class="pf-user-name">

                                {{ current_user.username }}

                            </span>

                            <small>

                                Pet Parent

                            </small>

                        </div>

                        <i class="bi bi-chevron-down"></i>

                    </button>


                    <!-- ======================================
                         DROPDOWN
                    ======================================= -->

                    <ul class="dropdown-menu dropdown-menu-end shadow-lg">

                        <li>

                            <div class="dropdown-header">

                                Signed in as

                                <strong>

                                    {{ current_user.username }}

                                </strong>

                            </div>

                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>

                            <a class="dropdown-item" href="#">

                                <i class="bi bi-person-circle"></i>

                                Profile

                            </a>

                        </li>

                        <li>

                            <a class="dropdown-item" href="#">

                                <i class="bi bi-gear-fill"></i>

                                Settings

                            </a>

                        </li>

                        <li>

                            <a class="dropdown-item" href="#">

                                <i class="bi bi-question-circle"></i>

                                Help Center

                            </a>

                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>

                            <a class="dropdown-item text-danger" href="{{ url_for('logout') }}">

                                <i class="bi bi-box-arrow-right"></i>

                                Logout

                            </a>

                        </li>

                    </ul>

                </div>

                {% else %}

                <div class="pf-auth-buttons">

                    <a href="{{ url_for('login') }}" class="btn btn-outline-primary">

                        Login

                    </a>

                    <a href="{{ url_for('register') }}" class="btn btn-primary">

                        Get Started

                    </a>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
