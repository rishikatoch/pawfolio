<!-- ==========================================================
     Floating Profile Statistics
========================================================== -->

<div class="container profile-stats">

    <div class="row g-4">

        <div class="col-lg-3 col-md-6">

            <div class="stat-card">

                <h2>
                    <i class="bi bi-speedometer2"></i>
                </h2>

                <h5>

                    {% if pet.weight %}
                    {{ pet.weight }} kg
                    {% else %}
                    —
                    {% endif %}

                </h5>

                <p>Current Weight</p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="stat-card">

                <h2>
                    <i class="bi bi-cake2-fill"></i>
                </h2>

                <h5>

                    {{ pet.age_display }}

                </h5>

                <p>Age</p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="stat-card">

                <h2>
                    <i class="bi bi-calendar-heart"></i>
                </h2>

                {% if next_due %}

                <h5>

                    {{ next_due.date.strftime("%d %b %Y") }}

                </h5>

                <p>

                    {{ next_due.title }}

                </p>

                {% else %}

                <h5>

                    None

                </h5>

                <p>

                    No upcoming reminders

                </p>

                {% endif %}

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="stat-card">

                <h2>
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </h2>

                <h5 class="
                    {% if overdue_count == 0 %}
                        text-success
                    {% elif overdue_count == 1 %}
                        text-warning
                    {% else %}
                        text-danger
                    {% endif %}
                ">
                    {{ overdue_count }}
                </h5>

                <p>Overdue Reminders</p>

            </div>

        </div>

    </div>

</div>
