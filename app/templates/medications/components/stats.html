<!-- ==========================================================
                    MEDICATION STATISTICS
========================================================== -->

<div class="row g-4 mb-5">

    <div class="col-lg-4">

        <div class="card shadow-sm border-0 h-100 medication-stat-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <small class="text-muted text-uppercase">

                            Total Medications

                        </small>

                        <h2 class="fw-bold mt-2 mb-0">

                            {{ medications|length }}

                        </h2>

                    </div>

                    <div class="display-5">

                        💊

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-4">

        <div class="card shadow-sm border-0 h-100 medication-stat-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <small class="text-muted text-uppercase">

                            Active Treatments

                        </small>

                        <h2 class="fw-bold mt-2 mb-0">

                            {{ medications|selectattr("is_active")|list|length }}

                        </h2>

                    </div>

                    <div class="display-5">

                        🟢

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="col-lg-4">

        <div class="card shadow-sm border-0 h-100 medication-stat-card">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <small class="text-muted text-uppercase">

                            Completed Treatments

                        </small>

                        <h2 class="fw-bold mt-2 mb-0">

                            {{ medications|rejectattr("is_active")|list|length }}

                        </h2>

                    </div>

                    <div class="display-5">

                        ✅

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
