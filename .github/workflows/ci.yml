name: Continuous Integration

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - ui-redesign

permissions:
  contents: read

jobs:
  test:
    name: Flask Tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pawfolio_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d pawfolio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pawfolio_test
      SECRET_KEY: test-secret-key
      FLASK_ENV: testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies

        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 .

      - name: Run Tests
        run: pytest

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Image
        run: docker build -t pawfolio:test .
