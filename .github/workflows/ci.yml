name: Continuous Integration

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - ui-redesign

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flask Tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pawfolio_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d pawfolio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pawfolio_test
      SECRET_KEY: test-secret-key
      FLASK_ENV: testing

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # --------------------------------------------------
      # Code Quality
      # --------------------------------------------------

      - name: Run Flake8
        run: |
          set -euo pipefail
          flake8 .

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------

      - name: Run Pytest
        run: |
          set -euo pipefail
          pytest

      # --------------------------------------------------
      # Docker Compose
      # --------------------------------------------------

      - name: Create Docker Environment File
        run: |
          set -euo pipefail

          cat <<EOF > .env.docker
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pawfolio_test
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=pawfolio_test
          SECRET_KEY=test-secret-key
          FLASK_DEBUG=False
          EOF

      - name: Validate Docker Compose
        run: |
          set -euo pipefail
          docker compose config

      # --------------------------------------------------
      # Docker Image
      # --------------------------------------------------

      - name: Build Docker Image
        run: |
          set -euo pipefail

          DOCKER_BUILDKIT=1 docker build -t pawfolio:test .

      # --------------------------------------------------
      # Trivy Container Security Scan
      # --------------------------------------------------

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pawfolio:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # --------------------------------------------------
      # Pawfolio Helm Chart
      # --------------------------------------------------

      - name: Lint Pawfolio Helm Chart
        run: |
          set -euo pipefail
          helm lint ./pawfolio-chart

      - name: Render Pawfolio Helm Templates
        run: |
          set -euo pipefail

          helm template pawfolio ./pawfolio-chart \
            --namespace pawfolio

      # --------------------------------------------------
      # Kubernetes Manifests
      # --------------------------------------------------

      - name: Validate Kubernetes Manifests
        run: |
          set -euo pipefail

          kubectl kustomize kubernetes/

      # --------------------------------------------------
      # Helm Repositories
      # --------------------------------------------------

      - name: Setup Helm Repositories
        run: |
          set -euo pipefail

          helm repo add grafana \
            https://grafana.github.io/helm-charts

          helm repo add grafana-community \
            https://grafana-community.github.io/helm-charts

          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts

          helm repo update

      # --------------------------------------------------
      # Loki - Local
      # --------------------------------------------------

      - name: Validate Loki Local Configuration
        run: |
          set -euo pipefail

          helm template loki grafana-community/loki \
            --version 18.7.5 \
            --namespace monitoring \
            --values observability/loki-values-local.yaml

      # --------------------------------------------------
      # Loki - AWS EKS
      # --------------------------------------------------

      - name: Validate Loki EKS Configuration
        run: |
          set -euo pipefail

          helm template loki grafana-community/loki \
            --version 18.7.5 \
            --namespace monitoring \
            --values observability/loki-values-eks.yaml

      # --------------------------------------------------
      # Grafana Alloy
      # --------------------------------------------------

      - name: Validate Grafana Alloy Configuration
        run: |
          set -euo pipefail

          helm template alloy grafana/alloy \
            --version 1.11.1 \
            --namespace monitoring \
            --values observability/alloy-values.yaml

      # --------------------------------------------------
      # Grafana
      # --------------------------------------------------

      - name: Validate Grafana Configuration
        run: |
          set -euo pipefail

          helm template grafana grafana/grafana \
            --namespace monitoring \
            --values observability/grafana-values.yaml

      # --------------------------------------------------
      # Prometheus
      # --------------------------------------------------

      - name: Validate Prometheus Configuration
        run: |
          set -euo pipefail

          helm template prometheus prometheus-community/prometheus \
            --version 29.21.0 \
            --namespace monitoring \
            --values observability/prometheus-values.yaml
