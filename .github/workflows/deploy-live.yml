name: Deploy Live

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: rishikatoch
  PAWFOLIO_IMAGE: ghcr.io/rishikatoch/pawfolio
  DORA_IMAGE: ghcr.io/rishikatoch/pawfolio-dora

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    name: Build, Push & Update GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Build Pawfolio Docker Image
      # --------------------------------------------------

      - name: Build Docker Image
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$PAWFOLIO_IMAGE:${GITHUB_SHA}" \
            .

      # --------------------------------------------------
      # Build DORA Metrics Exporter Image
      # --------------------------------------------------

      - name: Build DORA Metrics Image
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$DORA_IMAGE:dora" \
            ./dora

      # --------------------------------------------------
      # Trivy Pawfolio Security Gate
      # --------------------------------------------------

      - name: Trivy Container Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.PAWFOLIO_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      # --------------------------------------------------
      # Trivy DORA Security Gate
      # --------------------------------------------------

      - name: Trivy DORA Container Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DORA_IMAGE }}:dora
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      # --------------------------------------------------
      # Generate SBOM
      # --------------------------------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.PAWFOLIO_IMAGE }}:${{ github.sha }}
          syft-version: "v1.50.0"
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: pawfolio-sbom.spdx.json
          upload-artifact: true

      # --------------------------------------------------
      # Push Pawfolio Docker Image
      # --------------------------------------------------

      - name: Push Pawfolio Image
        run: |
          set -euo pipefail

          docker push "$PAWFOLIO_IMAGE:${GITHUB_SHA}"

      # --------------------------------------------------
      # Push DORA Image
      # --------------------------------------------------

      - name: Push DORA Image
        run: |
          set -euo pipefail

          docker push "$DORA_IMAGE:dora"

      # --------------------------------------------------
      # Get DORA Image Digest
      # --------------------------------------------------

      - name: Get DORA Image Digest
        id: dora-digest
        run: |
          set -euo pipefail

          DORA_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$DORA_IMAGE:dora")

          if [[ -z "$DORA_DIGEST" ]]; then
            echo "ERROR: Could not determine DORA image digest."
            exit 1
          fi

          # Extract only sha256:...
          DORA_DIGEST="${DORA_DIGEST##*@}"

          if [[ ! "$DORA_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid DORA digest: $DORA_DIGEST"
            exit 1
          fi

          echo "DORA digest: $DORA_DIGEST"
          echo "digest=$DORA_DIGEST" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Cosign Image Signing
      # --------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Container Image
        env:
          IMAGE: ${{ env.PAWFOLIO_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail

          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE")

          echo "Signing image:"
          echo "$DIGEST"

          cosign sign --yes "$DIGEST"

      # --------------------------------------------------
      # Update Helm Image Tag and DORA Digest
      # --------------------------------------------------

      - name: Update Helm Image Tag and DORA Digest
        env:
          IMAGE_TAG: ${{ github.sha }}
          DORA_DIGEST: ${{ steps.dora-digest.outputs.digest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pawfolio-chart/values.yaml")

          image_tag = os.environ["IMAGE_TAG"]
          dora_digest = os.environ["DORA_DIGEST"]

          content = path.read_text()

          # Update Pawfolio application image tag.
          pattern = (
              r'(?ms)(^image:\s*\n.*?^\s+tag:\s*)'
              r'["\']?[^"\']+["\']?'
          )

          content, count = re.subn(
              pattern,
              rf'\g<1>"{image_tag}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find exactly one image.tag entry "
                  "under the main image configuration."
              )

          # Update DORA image digest.
          pattern = (
              r'(?ms)(^dora:\s*\n\s+image:\s*\n'
              r'.*?^\s+digest:\s*)'
              r'["\']?[^"\']*["\']?'
          )

          content, count = re.subn(
              pattern,
              rf'\g<1>"{dora_digest}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find exactly one dora.image.digest entry."
              )

          path.write_text(content)

          print(f"Updated image.tag to {image_tag}")
          print(f"Updated dora.image.digest to {dora_digest}")
          PY

          echo "Updated Helm values:"
          grep -A4 '^image:' pawfolio-chart/values.yaml
          grep -A6 '^dora:' pawfolio-chart/values.yaml

      # --------------------------------------------------
      # Commit GitOps Update
      # --------------------------------------------------

      - name: Commit GitOps Update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pawfolio-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "chore: deploy ${GITHUB_SHA::7}"
          git push
