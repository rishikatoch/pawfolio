name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::977574653467:role/pawfolio-github-actions
  ECR_REPOSITORY: 977574653467.dkr.ecr.us-west-2.amazonaws.com/pawfolio

jobs:
  deploy:
    name: Build, Push & Update GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Pawfolio

      # --------------------------------------------------
      # Verify AWS Identity
      # --------------------------------------------------

      - name: Verify AWS Identity
        run: |
          set -euo pipefail

          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------------------------
      # Login to ECR
      # --------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------

      - name: Build Docker Image
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$ECR_REPOSITORY:${GITHUB_SHA}" \
            .

      # --------------------------------------------------
      # Trivy Security Gate
      # --------------------------------------------------

      - name: Trivy Container Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      # --------------------------------------------------
      # Generate SBOM
      # --------------------------------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          syft-version: "1.50.0"
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: pawfolio-sbom.spdx.json
          upload-artifact: true

      # --------------------------------------------------
      # Push Docker Image
      # --------------------------------------------------

      - name: Push Docker Image
        run: |
          set -euo pipefail

          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"

      # --------------------------------------------------
      # Cosign Image Signing
      # --------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign Container Image
        env:
          IMAGE: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")

          echo "Signing image:"
          echo "$DIGEST"

          cosign sign --yes "$DIGEST"

      # --------------------------------------------------
      # Update Helm Image Tag
      # --------------------------------------------------

      - name: Update Helm Image Tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pawfolio-chart/values.yaml")
          image_tag = os.environ["IMAGE_TAG"]

          content = path.read_text()

          pattern = (
              r'(?ms)(^image:\s*\n.*?^\s+tag:\s*)'
              r'["\']?[^"\']+["\']?'
          )

          updated, count = re.subn(
              pattern,
              rf'\g<1>"{image_tag}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find exactly one image.tag entry "
                  "under the image configuration."
              )

          path.write_text(updated)

          print(f"Updated image.tag to {image_tag}")
          PY

          echo "Updated Helm values:"
          grep -A2 '^image:' pawfolio-chart/values.yaml

      # --------------------------------------------------
      # Validate Helm Chart
      # --------------------------------------------------

      - name: Validate Helm Chart
        run: |
          set -euo pipefail

          helm lint ./pawfolio-chart

          helm template pawfolio ./pawfolio-chart \
            --namespace pawfolio

      # --------------------------------------------------
      # Commit GitOps Change
      # --------------------------------------------------

      - name: Commit GitOps Change
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pawfolio-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: deploy Pawfolio ${GITHUB_SHA::7}"

          git push origin HEAD:main

      # --------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "Pawfolio Deployment"
          echo "========================================"
          echo "Commit:      $GITHUB_SHA"
          echo "Image:       $ECR_REPOSITORY:$GITHUB_SHA"
          echo "GitOps:      values.yaml updated"
          echo "Argo Rollout: enabled"
          echo "========================================"
