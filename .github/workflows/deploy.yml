name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::977574653467:role/pawfolio-github-actions
  ECR_REPOSITORY: 977574653467.dkr.ecr.us-west-2.amazonaws.com/pawfolio

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    name: Build, Push & Update GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Configure AWS using GitHub OIDC
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Pawfolio

      # --------------------------------------------------
      # Verify AWS Identity
      # --------------------------------------------------

      - name: Verify AWS Identity
        run: |
          set -euo pipefail

          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------------------------
      # Login to ECR
      # --------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Build Pawfolio Docker Image
      # --------------------------------------------------

      - name: Build Docker Image
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$ECR_REPOSITORY:${GITHUB_SHA}" \
            .

      # --------------------------------------------------
      # Build DORA Metrics Exporter Image
      # --------------------------------------------------

      - name: Build DORA Metrics Image
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$ECR_REPOSITORY:dora" \
            ./dora

      # --------------------------------------------------
      # Trivy Pawfolio Security Gate
      # --------------------------------------------------

      - name: Trivy Container Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      # --------------------------------------------------
      # Trivy DORA Security Gate
      # --------------------------------------------------

      - name: Trivy DORA Container Security Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:dora
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          vuln-type: os,library
          scanners: vuln

      # --------------------------------------------------
      # Generate SBOM
      # --------------------------------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          syft-version: "v1.50.0"
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: pawfolio-sbom.spdx.json
          upload-artifact: true

      # --------------------------------------------------
      # Push Pawfolio Docker Image
      # --------------------------------------------------

      - name: Push Docker Image
        run: |
          set -euo pipefail

          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"

      # --------------------------------------------------
      # Push DORA Image
      # --------------------------------------------------

      - name: Push DORA Image
        run: |
          set -euo pipefail

          docker push "$ECR_REPOSITORY:dora"

      # --------------------------------------------------
      # Get DORA Image Digest
      # --------------------------------------------------

      - name: Get DORA Image Digest
        id: dora-digest
        run: |
          set -euo pipefail

          DORA_DIGEST=$(aws ecr describe-images \
            --repository-name pawfolio \
            --image-ids imageTag=dora \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ -z "$DORA_DIGEST" || "$DORA_DIGEST" == "None" ]]; then
            echo "ERROR: Could not determine DORA image digest."
            exit 1
          fi

          echo "DORA digest: $DORA_DIGEST"
          echo "digest=$DORA_DIGEST" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Cosign Image Signing
      # --------------------------------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign Container Image
        env:
          IMAGE: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")

          echo "Signing image:"
          echo "$DIGEST"

          cosign sign --yes "$DIGEST"

      # --------------------------------------------------
      # Update Helm Image Tag and DORA Digest
      # --------------------------------------------------

      - name: Update Helm Image Tag and DORA Digest
        env:
          IMAGE_TAG: ${{ github.sha }}
          DORA_DIGEST: ${{ steps.dora-digest.outputs.digest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pawfolio-chart/values.yaml")

          image_tag = os.environ["IMAGE_TAG"]
          dora_digest = os.environ["DORA_DIGEST"]

          content = path.read_text()

          # Update Pawfolio application image tag.
          pattern = (
              r'(?ms)(^image:\s*\n.*?^\s+tag:\s*)'
              r'["\']?[^"\']+["\']?'
          )

          content, count = re.subn(
              pattern,
              rf'\g<1>"{image_tag}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find exactly one image.tag entry "
                  "under the main image configuration."
              )

          # Update DORA image digest.
          pattern = (
              r'(?ms)(^dora:\s*\n\s+image:\s*\n'
              r'.*?^\s+digest:\s*)'
              r'["\']?[^"\']*["\']?'
          )

          content, count = re.subn(
              pattern,
              rf'\g<1>"{dora_digest}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find exactly one dora.image.digest entry."
              )

          path.write_text(content)

          print(f"Updated image.tag to {image_tag}")
          print(f"Updated dora.image.digest to {dora_digest}")
          PY

          echo "Updated Helm values:"
          grep -A4 '^image:' pawfolio-chart/values.yaml
          grep -A6 '^dora:' pawfolio-chart/values.yaml
