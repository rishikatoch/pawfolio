version: 2

updates:
  ##################################################
  # Python Packages
  ##################################################

  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "deps"

    labels:
      - dependencies
      - python

    groups:
      python-dependencies:
        patterns:
          - "*"

  ##################################################
  # GitHub Actions
  ##################################################

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "UTC"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "ci"

    labels:
      - dependencies
      - github-actions

    groups:
      github-actions:
        patterns:
          - "*"

  ##################################################
  # Docker
  ##################################################

  - package-ecosystem: "docker"
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "UTC"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "docker"

    labels:
      - dependencies
      - docker

  ##################################################
  # Terraform
  ##################################################

  - package-ecosystem: "terraform"
    directory: "/terraform"

    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: "UTC"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "terraform"

    labels:
      - dependencies
      - terraform

    groups:
      terraform-providers:
        patterns:
          - "*"
