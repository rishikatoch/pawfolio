apiVersion: apps/v1
kind: Deployment

metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_35=Flask application intentionally uses environment variables for secrets
  name: pawfolio
  namespace: pawfolio

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pawfolio

  template:
    metadata:
      labels:
        app: pawfolio

    spec:
      containers:
        - name: pawfolio

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

          image: pawfolio:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: pawfolio-config
            - secretRef:
                name: pawfolio-secret

          ports:
            - containerPort: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
