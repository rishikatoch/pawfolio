apiVersion: apps/v1
kind: Deployment

metadata:
  name: pawfolio
  namespace: pawfolio

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pawfolio

  template:
    metadata:
      labels:
        app: pawfolio

    spec:
      containers:
        - name: pawfolio
          image: pawfolio:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: pawfolio-config
            - secretRef:
                name: pawfolio-secret

          ports:
            - containerPort: 5000
